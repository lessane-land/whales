<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ballenas, 3D prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1f3a; overflow: hidden; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; }
  .type { position: fixed; right: 48px; bottom: 60px; text-align: right; color: #fff; font-family: "Iowan Old Style", Palatino, Georgia, serif; text-shadow: 0 1px 14px rgba(0,0,0,.5); }
  .type .d { font-size: 96px; line-height: 1; }
  .type .w { font-size: 22px; color: rgba(234,244,247,.8); margin-top: 6px; }
  .type .s { font-size: 20px; margin-top: 10px; }
  .type .m { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; color: rgba(234,244,247,.55); margin-top: 8px; }
  .title { position: fixed; left: 32px; top: 28px; color: #0b1f3a; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 44px; }
  .title small { display: block; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; opacity: .7; margin-top: 4px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="sea"></canvas>
<canvas id="gl"></canvas>
<div class="title">Ballenas<small>Ballenas reales, inmersión a inmersión</small></div>
<div class="type"><div class="d">30 m</div><div class="w">Jorobada Samovar</div><div class="s">Gira de costado sobre la arena a 30 metros, barriendo lanzones.</div><div class="m">Banco de Stellwagen, julio de 2009 · 90 veces más rápido</div></div>
<script type="module" src="three.js"></script>
</body>
</html>
