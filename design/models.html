<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ballenas, model candidates</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1f3a; overflow: hidden; }
  #sea, #gl { position: fixed; inset: 0; width: 100%; height: 100%; }
  .type { position: fixed; right: 48px; bottom: 60px; text-align: right; color: #fff; font-family: "Iowan Old Style", Palatino, Georgia, serif; text-shadow: 0 1px 14px rgba(0,0,0,.5); }
  .type .d { font-size: 96px; line-height: 1; }
  .type .w { font-size: 22px; color: rgba(234,244,247,.8); margin-top: 6px; }
  .type .m { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; color: rgba(234,244,247,.55); margin-top: 8px; }
  .tag { position: fixed; left: 32px; bottom: 40px; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; color: rgba(234,244,247,.7); }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="sea"></canvas>
<canvas id="gl"></canvas>
<div class="type"><div class="d">30 m</div><div class="w">Jorobada Samovar</div><div class="m">Banco de Stellwagen, julio de 2009</div></div>
<div class="tag" id="tag"></div>
<script type="module" src="models.js"></script>
</body>
</html>
