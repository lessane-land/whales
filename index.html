<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1f3a">
<title>Ballenas</title>
<meta name="description" content="Cachalotes reales, inmersión a inmersión, con datos abiertos.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/site.css?v=43">
</head>
<body>
<canvas id="sea" aria-label="Mar"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>

<header class="top">
  <h1 class="title"><span data-i18n="title">Ballenas</span></h1>
  <p class="tagline" data-i18n="tagline">Cachalotes reales, inmersión a inmersión</p>
</header>

<nav class="tools" aria-label="Opciones">
  <button class="pill" id="lang" type="button" aria-label="Language">EN</button>
  <button class="pill" id="sound" type="button" data-i18n="sound_on">Sonido</button>
  <button class="pill" id="speed" type="button" aria-label="Speed">90x</button>
  <button class="pill screen-btn" id="full" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span data-i18n="screen_on">Modo pantalla</span></button>
  <button class="pill" id="credits-open" type="button" data-i18n="credits">Créditos</button>
</nav>

<section class="deep" id="deep" aria-live="polite">
  <div class="globe-row">
    <div class="globe-text"><p class="globe-label" id="globe-label"></p><p class="globe-place" id="globe-place"></p></div>
    <canvas class="globe" id="globe" aria-hidden="true"></canvas>
  </div>
  <p class="deep-depth" id="deep-depth"></p>
  <p class="deep-who" id="deep-who"></p>
  <p class="deep-story" id="deep-story"></p>
  <p class="deep-kid" id="deep-kid"></p>
  <p class="deep-sub" id="deep-sub"></p>
  <p class="deep-bio" id="deep-bio"></p>
  <button class="pill about-open" id="about-open" type="button" data-i18n="about">Sobre la especie</button>
</section>

<nav class="scrub" id="species" aria-label="Especies">
  <button class="scrub-btn" id="species-prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="scrub-label" id="species-label" type="button"></button>
  <button class="scrub-btn" id="species-next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="menu" id="species-menu" hidden></div>
</nav>

<p class="hint" id="hint" hidden></p>

<button class="pill screen-exit" id="screen-exit" type="button" data-i18n="screen_off" hidden>Salir del modo pantalla</button>

<aside class="sheet" id="about" hidden>
  <div class="sheet-body sheet-wide about-body">
    <button class="pill sheet-close" id="about-close" type="button" data-i18n="close">Cerrar</button>
    <header class="about-head">
      <button class="scrub-btn" id="about-prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="about-title">
        <h2 id="about-name"></h2>
        <p class="latin" id="about-latin"></p>
      </div>
      <button class="scrub-btn" id="about-next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="menu menu-up" id="about-menu" hidden></div>
    </header>
    <div class="about-cols">
      <div class="about-left">
        <canvas class="about-portrait" id="about-portrait" aria-hidden="true"></canvas>
        <p class="about-status" id="about-status"></p>
        <p class="about-here" id="about-here"></p>
      </div>
      <dl class="about-list" id="about-grid"></dl>
    </div>
  </div>
</aside>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-kid" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0M9 8h.01M15 8h.01M10 10.5c1 1 3 1 4 0"/></symbol>
    <symbol id="i-wow" viewBox="0 0 24 24"><path d="M12 3l2.4 5.2 5.6.7-4.1 3.9 1.1 5.6L12 15.6l-5 2.8 1.1-5.6L4 8.9l5.6-.7z"/></symbol>
    <symbol id="i-size" viewBox="0 0 24 24"><path d="M3 12h18M3 9v6M21 9v6M8 10v4M13 10v4M18 10v4"/></symbol>
    <symbol id="i-weight" viewBox="0 0 24 24"><path d="M12 4v3M6 7h12l2 13H4zM9 7a3 3 0 0 1 6 0"/></symbol>
    <symbol id="i-lives" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-dives" viewBox="0 0 24 24"><path d="M12 3v15M6 12l6 6 6-6M4 21h16"/></symbol>
    <symbol id="i-eats" viewBox="0 0 24 24"><path d="M3 12c4-5 10-5 14 0-4 5-10 5-14 0zM17 12l4-3v6zM7 12h.01"/></symbol>
    <symbol id="i-sounds" viewBox="0 0 24 24"><path d="M3 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0"/></symbol>
    <symbol id="i-status" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3 8-8 9-5-1-8-4-8-9V6z"/></symbol>
  </defs>
</svg>

<aside class="sheet" id="credits" hidden>
  <div class="sheet-body">
    <button class="pill sheet-close" id="credits-close" type="button" data-i18n="close">Cerrar</button>
    <h2 data-i18n="credits">Créditos</h2>
    <p data-i18n="credits_intro"></p>
    <p data-i18n="credits_story"></p>
    <p data-i18n="credits_sound"></p>
    <p data-i18n="credits_data"></p>
    <p data-i18n="credits_paper"></p>
    <p data-i18n="credits_baleen"></p>
    <p data-i18n="credits_models"></p>
    <ul class="models" id="credits-models"></ul>
    <p data-i18n="credits_toothed"></p>
    <p data-i18n="credits_humpback"></p>
    <p class="muted" data-i18n="credits_made"></p>
  </div>
</aside>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }</script>
<script type="module" src="js/scene.js?v=43"></script>
<script src="js/i18n.js?v=43"></script>
<script src="js/sound.js?v=43"></script>
<script src="js/globe.js?v=43"></script>
<script src="js/whales.js?v=43"></script>
<script src="js/sea.js?v=43"></script>
<script src="js/app.js?v=43"></script>
</body>
</html>
